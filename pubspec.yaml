name: flutter_application
description: BMS 蓝牙电池管理系统
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # 蓝牙 BLE
  flutter_blue_plus: ^1.32.0

  # 状态管理
  flutter_riverpod: ^2.4.0

  # 网络请求
  dio: ^5.4.0

  # 本地存储
  shared_preferences: ^2.2.0

  # 权限
  permission_handler: ^13.0.1

  # 扫码
  mobile_scanner: ^3.5.0

  # 工具 (collection 由 Flutter SDK 内置，无需显式声明)

  # 文件分享
  share_plus: ^7.2.0
  path_provider: ^2.1.6
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/protocols/
